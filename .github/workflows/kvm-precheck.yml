# K+ — Pré-contrôle KVM sur un runner GitHub Actions (DIAGNOSTIC LECTURE SEULE)
# Destination : .github/workflows/kvm-precheck.yml du dépôt public Gwenaelle-pro/kplus-kvm-diagnostic.
# Déclenchement MANUEL uniquement. Aucune installation, aucune VM, aucun secret.
# v3 : ajoute un second sondage de l'API KVM AVEC sudo (requête de version seulement),
#      SANS modifier les permissions de /dev/kvm, SANS usermod, SANS création de VM.
name: kvm-precheck

on:
  workflow_dispatch: {}      # MANUEL seulement — pas de push, pas de pull_request, pas de schedule

permissions:
  contents: read             # lecture seule ; aucune écriture sur le dépôt

jobs:
  kvm-precheck:
    runs-on: ubuntu-24.04    # runner hébergé STANDARD (surtout pas ubuntu-slim)
    timeout-minutes: 5       # borne dure les minutes consommées
    steps:
      - name: Contexte du runner
        run: |
          echo "=== runner / image ==="
          echo "runner.os=${{ runner.os }}  runner.arch=${{ runner.arch }}"
          echo "ImageOS=$ImageOS  ImageVersion=$ImageVersion"
          uname -a
          echo "utilisateur: $(id)"
          echo "groupes: $(id -nG)"

      - name: Présence et permissions de /dev/kvm (lecture seule)
        run: |
          echo "=== /dev/kvm ==="
          ls -l /dev/kvm 2>&1 || echo "ABSENT"
          echo "=== accès effectif SANS sudo ==="
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then echo "RW_OK"; else echo "RW_NON"; fi
          echo "=== appartenance au groupe kvm ==="
          if id -nG | tr ' ' '\n' | grep -qx kvm; then echo "dans_groupe_kvm=oui"; else echo "dans_groupe_kvm=non"; fi

      - name: Flags de virtualisation et modules (lecture seule)
        run: |
          echo "=== flags CPU (vmx=Intel, svm=AMD) ==="
          grep -oE 'vmx|svm' /proc/cpuinfo | sort -u | tr '\n' ' '; echo "(vide = non exposés)"
          echo "=== modules kvm chargés ==="
          lsmod | grep -E '^kvm' || echo "aucun module kvm listé"

      - name: Écrire le script de sondage API (fichier local ; n'exécute rien sur KVM)
        run: |
          # KVM_GET_API_VERSION = _IO(0xAE, 0x00) = 0xAE00. Requête de VERSION uniquement :
          # ne crée NI ne démarre aucune VM, ne modifie AUCUNE permission.
          cat > "$RUNNER_TEMP/kvm_api.py" <<'PY'
          import os, fcntl, sys
          try:
              fd = os.open("/dev/kvm", os.O_RDWR | os.O_CLOEXEC)
          except OSError as e:
              print(f"KVM_OPEN_FAIL errno={e.errno} ({e.strerror})"); sys.exit(0)
          try:
              ver = fcntl.ioctl(fd, 0xAE00, 0)   # KVM_GET_API_VERSION
              print(f"KVM_API_VERSION={ver}")
              print("KVM_API_OK" if ver == 12 else f"KVM_API_UNEXPECTED={ver}")
          except OSError as e:
              print(f"KVM_IOCTL_FAIL errno={e.errno} ({e.strerror})")
          finally:
              os.close(fd)
          PY

      - name: API KVM SANS privilège (utilisateur runner)
        run: |
          python3 "$RUNNER_TEMP/kvm_api.py" | tee "$RUNNER_TEMP/kvm_user.txt"

      - name: API KVM AVEC sudo (requête de version seulement ; AUCUN chmod/usermod, AUCUNE VM)
        run: |
          # sudo est sans mot de passe sur les runners GitHub. On interroge SEULEMENT la
          # version de l'API ; on ne modifie pas /dev/kvm, on n'ajoute personne au groupe kvm.
          sudo python3 "$RUNNER_TEMP/kvm_api.py" | tee "$RUNNER_TEMP/kvm_sudo.txt"

      - name: VERDICT
        run: |
          user_ok=no; sudo_ok=no
          grep -q "KVM_API_OK" "$RUNNER_TEMP/kvm_user.txt" 2>/dev/null && user_ok=yes
          grep -q "KVM_API_OK" "$RUNNER_TEMP/kvm_sudo.txt" 2>/dev/null && sudo_ok=yes
          echo "api_sans_privilege=$user_ok  api_avec_sudo=$sudo_ok"
          if [ "$user_ok" = yes ]; then
            echo "VERDICT=KVM_UTILISABLE_SANS_PRIVILEGE"
          elif [ "$sudo_ok" = yes ]; then
            echo "VERDICT=KVM_UTILISABLE_AVEC_SUDO (API OK en root ; acces non-root securise RESTE a etablir pour Firecracker)"
          elif [ -e /dev/kvm ]; then
            echo "VERDICT=INDETERMINE (present mais API inaccessible meme avec sudo)"
          else
            echo "VERDICT=KVM_ABSENT_OU_INACCESSIBLE"
          fi
