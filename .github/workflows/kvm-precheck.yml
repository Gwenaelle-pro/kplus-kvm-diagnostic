# K+ — Pré-contrôle KVM_CREATE_VM sur un runner GitHub Actions (DIAGNOSTIC)
# Destination : .github/workflows/kvm-precheck.yml du dépôt public Gwenaelle-pro/kplus-kvm-diagnostic.
# Déclenchement MANUEL uniquement. AUCUN téléchargement, AUCUNE installation, AUCUN Firecracker.
# v4 : teste si la virtualisation imbriquée permet de CRÉER un objet VM KVM (KVM_CREATE_VM),
#      PUIS le ferme immédiatement. SANS vCPU, SANS mémoire invité, SANS disque, SANS réseau,
#      SANS démarrage d'invité. SANS modifier les permissions de /dev/kvm.
name: kvm-precheck

on:
  workflow_dispatch: {}      # MANUEL seulement — pas de push, pas de pull_request, pas de schedule

permissions:
  contents: read             # lecture seule ; aucune écriture sur le dépôt

jobs:
  kvm-precheck:
    runs-on: ubuntu-24.04    # runner hébergé STANDARD (surtout pas ubuntu-slim)
    timeout-minutes: 5       # borne dure les minutes consommées
    steps:
      - name: Contexte du runner
        run: |
          echo "ImageOS=$ImageOS  ImageVersion=$ImageVersion"
          uname -a
          echo "utilisateur: $(id)"
          ls -l /dev/kvm 2>&1 || echo "/dev/kvm ABSENT"

      - name: Écrire le script de sondage (fichier local ; n'exécute rien tant qu'il n'est pas appelé)
        run: |
          # KVM_GET_API_VERSION = _IO(0xAE,0x00)=0xAE00 ; KVM_CREATE_VM = _IO(0xAE,0x01)=0xAE01.
          # KVM_CREATE_VM alloue un OBJET VM dans le noyau et renvoie un nouveau descripteur.
          # On le FERME aussitôt. AUCUN vCPU (KVM_CREATE_VCPU non appelé), AUCUNE région mémoire,
          # AUCUN KVM_RUN : aucun système invité ne démarre.
          cat > "$RUNNER_TEMP/kvm_create.py" <<'PY'
          import os, fcntl, sys
          KVM_GET_API_VERSION = 0xAE00
          KVM_CREATE_VM       = 0xAE01
          try:
              fd = os.open("/dev/kvm", os.O_RDWR | os.O_CLOEXEC)
          except OSError as e:
              print(f"KVM_OPEN_FAIL errno={e.errno} ({e.strerror})"); sys.exit(0)
          try:
              ver = fcntl.ioctl(fd, KVM_GET_API_VERSION, 0)
              print(f"KVM_API_VERSION={ver}")
              try:
                  vmfd = fcntl.ioctl(fd, KVM_CREATE_VM, 0)   # crée l'objet VM (type 0)
                  if isinstance(vmfd, int) and vmfd >= 0:
                      print(f"KVM_CREATE_VM_OK vm_fd={vmfd}")
                      os.close(vmfd)                          # fermeture IMMÉDIATE de l'objet VM
                      print("KVM_VM_CLOSED")
                  else:
                      print(f"KVM_CREATE_VM_UNEXPECTED ret={vmfd}")
              except OSError as e:
                  print(f"KVM_CREATE_VM_FAIL errno={e.errno} ({e.strerror})")
          finally:
              os.close(fd)
          PY

      - name: Sondage KVM_CREATE_VM AVEC sudo (requête noyau seulement ; AUCUN chmod/usermod, AUCUN invité)
        run: |
          # sudo sans mot de passe sur les runners GitHub. On ne modifie AUCUNE permission.
          sudo python3 "$RUNNER_TEMP/kvm_create.py" | tee "$RUNNER_TEMP/kvm_create.txt"

      - name: VERDICT
        run: |
          f="$RUNNER_TEMP/kvm_create.txt"
          if grep -q "KVM_VM_CLOSED" "$f" 2>/dev/null; then
            echo "VERDICT=NESTED_KVM_CREATE_VM_OK"
          elif grep -q "KVM_CREATE_VM_FAIL" "$f" 2>/dev/null; then
            echo "VERDICT=NESTED_KVM_CREATE_VM_FAIL (virt imbriquee insuffisante pour creer une VM)"
          elif grep -q "KVM_OPEN_FAIL" "$f" 2>/dev/null; then
            echo "VERDICT=KVM_OPEN_FAIL (acces refuse meme avec sudo)"
          else
            echo "VERDICT=INDETERMINE"
          fi
